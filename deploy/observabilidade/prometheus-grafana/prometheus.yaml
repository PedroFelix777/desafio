apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sock-shop
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - "alertmanager.sock-shop.svc.cluster.local:9093"

    rule_files:
      - /etc/prometheus/alert-rules.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: sock-shop-front-end
        metrics_path: /metrics
        static_configs:
          - targets: ["front-end.sock-shop.svc.cluster.local:80"]

  alert-rules.yml: |
    groups:
      - name: disponibilidade
        rules:
          - alert: PrometheusTargetDown
            expr: up == 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Alvo indisponível"
              description: "O alvo {{ $labels.instance }} está indisponível há mais de 1 minuto."