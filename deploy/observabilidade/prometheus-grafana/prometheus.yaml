apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sock-shop
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: sock-shop-front-end
        metrics_path: /metrics
        static_configs:
          - targets: ["front-end.sock-shop.svc.cluster.local:80"]