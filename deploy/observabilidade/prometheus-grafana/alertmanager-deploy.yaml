apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: sock-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
          ports:
            - containerPort: 9093
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "96Mi"
              cpu: "200m"
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: sock-shop
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093