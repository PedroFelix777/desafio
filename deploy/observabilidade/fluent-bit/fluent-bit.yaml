apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: sock-shop
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        5
        Log_Level    info
        Daemon       off
        Parsers_File parsers.conf

    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Exclude_Path  /var/log/containers/fluent-bit-*.log
        Parser            cri
        Tag               kube.*
        Refresh_Interval  5
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
    
    [OUTPUT]
        Name                es
        Match               *
        Host                elasticsearch.sock-shop.svc.cluster.local
        Port                9200
        Logstash_Format     On
        Logstash_Prefix     sock-shop
        Suppress_Type_Name  On
        Retry_Limit         3